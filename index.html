<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Números Reales — Matemática Unidad 01</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    /* =====================================================
       ARCHITECTURAL ATELIER — DARK THEME
       Sistema de diseño para presentación académica
    ===================================================== */
    :root {
      --bg:          #0c0d10;
      --bg-low:      #18191e;
      --bg-mid:      #1e2027;
      --bg-high:     #262830;
      --bg-highest:  #32353e;
      --bg-lowest:   #121316;
      --fg:          #fbf9f4;
      --fg-dim:      #c9c6bc;
      --fg-muted:    #a4a8b5;
      --border:      #3b3e4a;
      --border-dim:  #262830;
      --accent:      #4d6ef5;   /* azul institucional */
      --accent-dim:  #3a56cc;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Space Grotesk', sans-serif;
      --sp-xs:.25rem;--sp-sm:.5rem;--sp-md:1rem;
      --sp-lg:1.5rem;--sp-xl:2.5rem;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--sans);-webkit-font-smoothing:antialiased;user-select:none}

    /* ---- LAYOUT ---- */
    #app{display:flex;flex-direction:column;height:100vh}

    /* ---- HEADER ---- */
    header{
      position:fixed;top:0;left:0;right:0;z-index:200;
      height:52px;
      background:rgba(12,13,16,.96);
      border-bottom:1px solid var(--border);
      backdrop-filter:blur(16px);
      display:flex;align-items:center;justify-content:space-between;
      padding:0 1.5rem;
    }
    .h-left{display:flex;align-items:center;gap:var(--sp-lg)}
    .h-right{display:flex;align-items:center;gap:var(--sp-md)}
    .btn-menu{
      display:flex;align-items:center;gap:6px;
      height:34px;padding:0 var(--sp-md);
      background:transparent;border:1px solid var(--border);
      color:var(--fg);cursor:pointer;
      font-family:var(--mono);font-size:10px;
      letter-spacing:.08em;text-transform:uppercase;
      transition:background .15s;
    }
    .btn-menu:hover{background:var(--bg-high)}
    .h-label{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted)}
    .h-label .hl{color:var(--fg);font-weight:600}
    .avatar{width:30px;height:30px;border-radius:50%;background:var(--bg-high);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--fg)}
    .mi{font-family:'Material Symbols Outlined';font-size:18px;font-weight:300;font-style:normal;line-height:1;letter-spacing:normal}

    /* ---- TELEMETRY ---- */
    .telemetry{
      position:fixed;top:52px;left:0;right:0;z-index:190;
      height:28px;
      background:rgba(18,19,22,.95);
      border-bottom:1px solid var(--border-dim);
      display:flex;align-items:center;justify-content:space-between;
      padding:0 1.5rem;
      font-family:var(--mono);font-size:9px;letter-spacing:.1em;
      text-transform:uppercase;color:var(--fg-muted);
    }
    .t-left{display:flex;align-items:center;gap:var(--sp-md)}
    .t-right{display:flex;align-items:center;gap:var(--sp-lg)}
    .dot{width:5px;height:5px;border-radius:50%;background:#4ade80;animation:blink 2s infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
    .t-hl{color:var(--fg);font-weight:600}
    .t-chip{background:var(--bg-high);border:1px solid var(--border);padding:1px 7px;color:var(--accent)}

    /* ---- PROGRESS ---- */
    .progress-track{position:fixed;bottom:52px;left:0;right:0;height:2px;background:var(--border-dim);z-index:190}
    .progress-fill{height:100%;background:var(--fg);transition:width .4s ease}

    /* ---- MAIN ---- */
    main{display:flex;flex:1;overflow:hidden;margin-top:80px;margin-bottom:52px}

    /* ---- LEFT PANEL ---- */
    #panel{
      width:300px;min-width:260px;
      background:var(--bg-lowest);
      border-right:1px solid var(--border-dim);
      display:flex;flex-direction:column;overflow:hidden;
      transition:width .25s ease,min-width .25s ease;
    }
    #panel.closed{width:0;min-width:0;border:none}
    .p-head{
      padding:var(--sp-sm) var(--sp-md);
      border-bottom:1px solid var(--border-dim);
      display:flex;align-items:center;justify-content:space-between;
    }
    .p-title{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg);font-weight:600}
    .p-count{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-muted)}
    .p-controls{display:flex;gap:4px;padding:var(--sp-xs) var(--sp-md);border-bottom:1px solid var(--border-dim)}
    .p-btn{
      flex:1;height:32px;display:flex;align-items:center;justify-content:center;gap:5px;
      background:var(--bg-low);border:1px solid var(--border-dim);color:var(--fg);
      cursor:pointer;font-family:var(--mono);font-size:9px;letter-spacing:.06em;
      text-transform:uppercase;transition:background .15s;white-space:nowrap;
    }
    .p-btn:hover{background:var(--bg-high)}
    .p-btn.on{background:var(--fg);color:var(--bg)}
    .badge{background:var(--bg-high);border:1px solid var(--border);padding:1px 5px;font-size:9px}
    #slide-list{flex:1;overflow-y:auto;padding:4px;display:flex;flex-direction:column;gap:3px}
    #slide-list::-webkit-scrollbar{width:3px}
    #slide-list::-webkit-scrollbar-thumb{background:var(--border)}
    .s-item{
      display:flex;align-items:flex-start;gap:var(--sp-sm);
      padding:var(--sp-sm);border:1px solid var(--border-dim);
      cursor:pointer;transition:all .15s;background:var(--bg-low);
    }
    .s-item:hover{background:var(--bg-high)}
    .s-item.on{background:var(--fg);border-color:var(--fg)}
    .s-num{
      width:36px;height:34px;flex-shrink:0;
      display:flex;align-items:center;justify-content:center;
      background:var(--bg-high);border:1px solid var(--border);
      font-family:var(--mono);font-size:11px;font-weight:600;color:var(--fg);
      transition:all .15s;
    }
    .s-item.on .s-num{background:rgba(0,0,0,.2);border-color:rgba(0,0,0,.3);color:var(--bg)}
    .s-item:hover:not(.on) .s-num{background:var(--accent);border-color:var(--accent);color:#fff}
    .s-info{flex:1;min-width:0}
    .s-cat{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted)}
    .s-item.on .s-cat{color:rgba(12,13,16,.5)}
    .s-t{font-size:12px;font-weight:600;color:var(--fg);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .s-item.on .s-t{color:var(--bg)}
    .s-sub{font-family:var(--mono);font-size:9px;color:var(--fg-muted);margin-top:2px}
    .s-item.on .s-sub{color:rgba(12,13,16,.45)}
    .s-active{display:none;align-items:center;gap:4px;font-family:var(--mono);font-size:8px;color:rgba(12,13,16,.5);margin-top:3px;letter-spacing:.06em;text-transform:uppercase}
    .s-item.on .s-active{display:flex}
    .s-dot{width:4px;height:4px;border-radius:50%;background:rgba(12,13,16,.4)}

    /* ---- CANVAS ---- */
    #canvas{flex:1;overflow:hidden;display:flex;flex-direction:column;position:relative}
    #slide-display{flex:1;overflow-y:auto;padding:var(--sp-lg) var(--sp-xl)}
    #slide-display::-webkit-scrollbar{width:5px}
    #slide-display::-webkit-scrollbar-thumb{background:var(--border)}
    .slide-canvas{
      background:var(--bg-lowest);border:1px solid var(--border-dim);
      position:relative;padding:var(--sp-xl);min-height:calc(100vh - 220px);
      animation:fadeIn .25s ease;
    }
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .c-tl,.c-tr,.c-bl,.c-br{position:absolute;font-family:var(--mono);font-size:9px;color:var(--border);pointer-events:none}
    .c-tl{top:8px;left:8px}.c-tr{top:8px;right:8px}.c-bl{bottom:8px;left:8px}.c-br{bottom:8px;right:8px}

    /* ---- SLIDE TYPOGRAPHY ---- */
    .s-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--sp-md)}
    .s-tag{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--bg-high);border:1px solid var(--border);padding:2px 8px}
    .s-ref{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-muted)}
    h1.sh1{font-size:clamp(26px,4vw,46px);font-weight:700;letter-spacing:-.03em;line-height:1.05;color:var(--fg);text-transform:uppercase;margin-bottom:var(--sp-md)}
    .divider{width:100%;height:1px;background:var(--fg);margin-bottom:var(--sp-lg)}
    .body-text{font-size:14px;line-height:1.65;color:var(--fg-dim)}
    .body-text-p{font-size:15px;color:var(--fg);line-height:1.6}

    /* ---- MATH ---- */
    .math{
      background:var(--bg-low);border:1px solid var(--border);
      border-left:2px solid var(--accent);
      padding:var(--sp-md) var(--sp-lg);margin:var(--sp-md) 0;
      font-family:var(--mono);font-size:13px;color:var(--accent);line-height:1.9;
    }

    /* ---- GRIDS ---- */
    .g2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-lg)}
    .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--sp-md)}

    /* ---- CARDS ---- */
    .card{background:var(--bg-low);border:1px solid var(--border-dim);padding:var(--sp-md)}
    .card-label{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
    .card-title{font-size:14px;font-weight:600;color:var(--fg);margin-bottom:4px}
    .card-body{font-size:13px;color:var(--fg-muted);line-height:1.6}

    /* ---- TABLES ---- */
    .tbl{width:100%;border-collapse:collapse;font-size:13px;margin:var(--sp-md) 0}
    .tbl th{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted);border-bottom:1px solid var(--border-dim);padding:var(--sp-sm) var(--sp-md);text-align:left;background:var(--bg-high)}
    .tbl td{padding:var(--sp-sm) var(--sp-md);border-bottom:1px solid var(--border-dim);color:var(--fg);vertical-align:middle}
    .tbl tr:last-child td{border-bottom:none}
    .tbl .a{color:var(--accent);font-family:var(--mono);font-size:12px}
    .tbl .m{font-family:var(--mono);font-size:12px}

    /* ---- COMPARE COLS ---- */
    .cc{background:var(--bg-low);border:1px solid var(--border-dim);padding:var(--sp-lg)}
    .cc-h{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding-bottom:var(--sp-sm);border-bottom:1px solid var(--border-dim);margin-bottom:var(--sp-md)}
    .cc-row{padding:var(--sp-sm) 0;border-bottom:1px solid var(--border-dim);font-size:13px;color:var(--fg);line-height:1.55}
    .cc-row:last-child{border-bottom:none}
    .cc-ex{font-family:var(--mono);font-size:11px;color:var(--accent);margin-top:3px}

    /* ---- COVER ---- */
    .cover-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-muted);margin-bottom:var(--sp-md)}
    .cover-title{font-size:clamp(44px,7vw,80px);font-weight:700;letter-spacing:-.04em;line-height:.95;color:var(--fg);text-transform:uppercase;margin-bottom:var(--sp-sm)}
    .cover-sub{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted);margin-bottom:var(--sp-xl)}
    .cover-tag{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted);margin-top:var(--sp-xl)}
    .svg-wrap{padding:var(--sp-md) var(--sp-lg);background:var(--bg-low);border:1px solid var(--border-dim);margin:var(--sp-lg) 0}

    /* ---- SYNTHESIS ---- */
    .syn-item{display:flex;align-items:flex-start;gap:var(--sp-md);padding:var(--sp-md);border:1px solid var(--border-dim);margin-bottom:6px;transition:background .15s}
    .syn-item:hover{background:var(--bg-high)}
    .syn-n{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent);flex-shrink:0;width:30px}
    .syn-t{font-size:14px;color:var(--fg);line-height:1.5}
    .final-box{margin-top:var(--sp-xl);padding:var(--sp-xl);border:1px solid var(--fg);text-align:center}
    .final-box p{font-size:clamp(16px,2.5vw,26px);font-weight:700;letter-spacing:-.01em;text-transform:uppercase;color:var(--accent);line-height:1.35}

    /* ---- FOOTER ---- */
    footer{position:fixed;bottom:0;left:0;right:0;z-index:200;height:52px;background:rgba(12,13,16,.96);border-top:1px solid var(--border);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem}
    .f-left{display:flex;align-items:center;gap:var(--sp-md);font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted)}
    .nav-wrap{display:flex;align-items:center;background:var(--bg-low);border:1px solid var(--border)}
    .nav-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:var(--fg);cursor:pointer;transition:background .15s}
    .nav-btn:hover{background:var(--bg-high)}
    .nav-btn:disabled{opacity:.3;cursor:default}
    .counter{padding:0 var(--sp-md);font-family:var(--mono);font-size:12px;display:flex;align-items:center;gap:5px;border-left:1px solid var(--border-dim);border-right:1px solid var(--border-dim)}
    .c-cur{color:var(--fg);font-weight:600}
    .c-sep{color:var(--border)}
    .c-tot{color:var(--fg-muted)}
    .f-right{display:flex;align-items:center;gap:4px}
    .i-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--border);color:var(--fg);cursor:pointer;transition:background .15s}
    .i-btn:hover{background:var(--bg-high)}

    /* ---- UTILS ---- */
    .mt-sm{margin-top:var(--sp-sm)}.mt-md{margin-top:var(--sp-md)}.mt-lg{margin-top:var(--sp-lg)}.mt-xl{margin-top:var(--sp-xl)}
    .accent{color:var(--accent)}.muted{color:var(--fg-muted)}.mono{font-family:var(--mono)}
    em{font-style:italic;color:var(--fg-dim)}

    /* ---- RESPONSIVE ---- */
    @media(max-width:768px){
      #panel{position:fixed;left:0;top:80px;bottom:52px;z-index:150;transform:translateX(-110%);transition:transform .3s ease;width:280px;min-width:280px}
      #panel.m-open{transform:translateX(0)}
      #panel.closed{transform:translateX(-110%)}
      #slide-display{padding:var(--sp-md)}
      .slide-canvas{padding:var(--sp-lg)}
      .g2,.g3{grid-template-columns:1fr}
      .cover-title{font-size:clamp(36px,10vw,52px)}
      .t-right{display:none}
    }
  </style>
</head>

<!-- HEADER -->
<header>
  <div class="h-left">
    <button class="btn-menu" id="menu-toggle">
      <span class="mi">menu</span>

<!-- TELEMETRY BAR -->

      <span class="mi">fullscreen</span>
    </button>

   SLIDE DATA — Números Reales (12 láminas)

const slides = [

/* 01 — PORTADA */

{id:'07',cat:'ÁLGEBRA',title:'Un Cuerpo Ordenado',sub:'Propiedades algebraicas de ℝ',
render(){return`
<div class="c-tl">┌ [X: 007.00 / Y: 000.00]</div><div class="c-br">ℝ ┘</div>

<h1 class="sh1">Un Cuerpo Ordenado</h1><div class="divider"></div>
<table class="tbl">
  <thead><tr><th>Propiedad</th><th>Suma</th><th>Producto</th></tr></thead>
  <tbody>
    <tr><td><strong>Conmutativa</strong></td><td class="a">a + b = b + a</td><td class="a">a · b = b · a</td></tr>
    <tr><td><strong>Asociativa</strong></td><td class="a">(a+b)+c = a+(b+c)</td><td class="a">(a·b)·c = a·(b·c)</td></tr>
    <tr><td><strong>Distributiva</strong></td><td class="muted m">—</td><td class="a">a·(b+c) = ab + ac</td></tr>
    <tr><td><strong>Elemento Neutro</strong></td><td class="a">a + 0 = a</td><td class="a">a · 1 = a</td></tr>
    <tr><td><strong>Elemento Inverso</strong></td><td class="a">a + (−a) = 0</td><td class="a">a · a⁻¹ = 1 (si a ≠ 0)</td></tr>
  </tbody>
</table>
<div class="math mt-lg"><strong>Tricotomía:</strong> Para cualesquiera a y b, se cumple exactamente una:<br>a &lt; b &nbsp;&nbsp;ó&nbsp;&nbsp; a = b &nbsp;&nbsp;ó&nbsp;&nbsp; a &gt; b</div>
<div class="card mt-md"><div class="card-label">¿Qué es un cuerpo ordenado?</div><div class="card-body" style="font-size:13px;line-height:1.65">Un <strong>cuerpo</strong> es una estructura algebraica donde se puede sumar, restar, multiplicar y dividir (excepto por cero). ℝ es el único cuerpo ordenado y completo, salvo isomorfismo.</div></div>
`}},

    <div class="card mt-md"><div class="card-label">Distancia entre puntos</div><div class="card-body" style="font-size:12px;line-height:1.65">La distancia entre dos puntos a y b en ℝ es |b − a|. Es siempre no negativa.</div></div>

/* =====================================================
   STATE
===================================================== */
let cur = 0, panelOpen = true, autoOn = false, autoTimer = null;

/* =====================================================
   DOM REFS
===================================================== */
const listEl    = document.getElementById('slide-list');
const contentEl = document.getElementById('sc');
const progEl    = document.getElementById('prog');
const curEl     = document.getElementById('c-cur');
const fRefEl    = document.getElementById('f-ref');
const btnPrev   = document.getElementById('btn-prev');
const btnNext   = document.getElementById('btn-next');
const menuBtn   = document.getElementById('menu-toggle');
const panelEl   = document.getElementById('panel');
const autoBtn   = document.getElementById('btn-auto');
const autoIcon  = document.getElementById('auto-icon');
const autoBadge = document.getElementById('auto-badge');

/* =====================================================
   RENDER LIST
===================================================== */
function renderList() {
  listEl.innerHTML = '';
  slides.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 's-item' + (i === cur ? ' on' : '');
    el.innerHTML = `
      <div class="s-num">${s.id}</div>
      <div class="s-info">
        <div class="s-cat">${s.cat}</div>
        <div class="s-t">${s.title}</div>
        <div class="s-sub">${s.sub}</div>
        <div class="s-active"><span class="s-dot"></span><span>EN PANTALLA</span></div>
      </div>`;
    el.addEventListener('click', () => go(i));
    listEl.appendChild(el);
  });
  listEl.children[cur]?.scrollIntoView({block:'nearest',behavior:'smooth'});
}

/* =====================================================
   RENDER SLIDE
===================================================== */
function renderSlide() {
  const s = slides[cur];
  contentEl.style.animation = 'none';
  void contentEl.offsetHeight;
  contentEl.style.animation = '';
  contentEl.innerHTML = s.render();
  curEl.textContent = s.id;
  progEl.style.width = ((cur+1)/slides.length*100) + '%';
  btnPrev.disabled = cur === 0;
  btnNext.disabled = cur === slides.length - 1;
  fRefEl.textContent = 'SEC 01 // REF NR-' + s.id.padStart(3,'0');
  renderList();
  document.getElementById('slide-display').scrollTop = 0;
}

/* =====================================================
   NAVIGATION
===================================================== */
function go(n) { if(n>=0 && n<slides.length){cur=n;renderSlide()} }
btnPrev.addEventListener('click', ()=>go(cur-1));
btnNext.addEventListener('click', ()=>go(cur+1));

/* =====================================================
   AUTOPLAY
===================================================== */
autoBtn.addEventListener('click', () => {
  autoOn = !autoOn;
  if(autoOn){
    autoIcon.textContent = 'pause';
    autoBadge.textContent = 'ON';
    autoBadge.style.background = 'var(--fg)';
    autoBadge.style.color = 'var(--bg)';
    autoTimer = setInterval(()=>go(cur < slides.length-1 ? cur+1 : 0), 4000);
    autoBtn.classList.add('on');
  } else {
    autoIcon.textContent = 'play_arrow';
    autoBadge.textContent = '4s';
    autoBadge.style.background = '';
    autoBadge.style.color = '';
    clearInterval(autoTimer);
    autoBtn.classList.remove('on');
  }
});

/* =====================================================
   MENU TOGGLE
===================================================== */
menuBtn.addEventListener('click', () => {
  panelOpen = !panelOpen;
  if(window.innerWidth <= 768) {
    panelEl.classList.toggle('m-open');
    panelEl.classList.remove('closed');
  } else {
    panelEl.classList.toggle('closed');
  }
});

/* =====================================================
   FULLSCREEN
===================================================== */
function toggleFS() {
  !document.fullscreenElement
    ? document.documentElement.requestFullscreen().catch(()=>{})
    : document.exitFullscreen();
}
document.getElementById('btn-fs').addEventListener('click', toggleFS);
document.getElementById('btn-fs2').addEventListener('click', toggleFS);

/* =====================================================
   KEYBOARD
===================================================== */
window.addEventListener('keydown', e => {
  switch(e.key){
    case 'ArrowRight': case 'ArrowDown': case ' ': e.preventDefault(); go(cur+1); break;
    case 'ArrowLeft':  case 'ArrowUp':              e.preventDefault(); go(cur-1); break;
    case 'f': case 'F': toggleFS(); break;
    case 'Home': go(0); break;
    case 'End':  go(slides.length-1); break;
  }
});

/* =====================================================
   INIT
===================================================== */
renderSlide();
</script>
